name: Deploy frontend preview to GitHub Pages

# Builds the web/ frontend as a static export (no Python backend) and
# deploys to GitHub Pages. This is a DESIGN PREVIEW — the form is
# inert and shows a notice. The full hosted version with backend
# functions deploys to Vercel via .github/workflows/deploy-web.yml.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          DEPLOY_TARGET: pages
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build

      - name: Add .nojekyll (so Next.js _next assets are served)
        working-directory: web
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
